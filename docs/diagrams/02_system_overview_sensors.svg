<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Host PC connections to sensors that plug in directly, without an Arduino</title>
<desc>Host PC at top connects via USB directly to the BNO086 IMU, L76X GPS, RPLIDAR C1, and two USB cameras - none of these go through an Arduino board.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  .box { fill: #F1EFE8; stroke: #5F5E5A; }
  .sensor { fill: #FAECE7; stroke: #993C1D; }
  .th { font: 500 14px sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12px sans-serif; fill: #5F5E5A; }
  .sensor .th { fill: #4A1B0C; }
  .sensor .ts { fill: #712B13; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>

<g><rect class="box" x="230" y="30" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Host PC</text>
<text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">Ubuntu 22.04, ROS 2</text></g>

<line x1="340" y1="86" x2="107" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="257" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="407" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="557" y2="160" class="arr" marker-end="url(#arrow)"/>

<g><rect class="sensor" x="40" y="160" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="107" y="178" text-anchor="middle" dominant-baseline="central">IMU</text>
<text class="ts" x="107" y="196" text-anchor="middle" dominant-baseline="central">USB-TTL adapter</text></g>
<g><rect class="sensor" x="190" y="160" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="178" text-anchor="middle" dominant-baseline="central">GPS</text>
<text class="ts" x="257" y="196" text-anchor="middle" dominant-baseline="central">USB-TTL adapter</text></g>
<g><rect class="sensor" x="340" y="160" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="407" y="178" text-anchor="middle" dominant-baseline="central">LIDAR</text>
<text class="ts" x="407" y="196" text-anchor="middle" dominant-baseline="central">USB, native</text></g>
<g><rect class="sensor" x="490" y="160" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="557" y="178" text-anchor="middle" dominant-baseline="central">Cameras</text>
<text class="ts" x="557" y="196" text-anchor="middle" dominant-baseline="central">2x USB, native</text></g>
</svg>
