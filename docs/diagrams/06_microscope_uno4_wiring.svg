<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Microscope Uno 4 wiring: focus stepper, LED, lens cover servo</title>
<desc>Microscope Uno number 4 connects to three groups: a 28BYJ-48 focus stepper through a ULN2003 driver on four pins, a PWM-dimmable LED on one pin, and a lens cover servo on one pin. The microscope's USB camera connects to the host computer directly, not through this board.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  .board { fill: #E1F5EE; stroke: #0F6E56; }
  .cat { fill: #FAEEDA; stroke: #854F0B; }
  .th { font: 500 14px sans-serif; }
  .ts { font: 400 12px sans-serif; }
  .board .th { fill: #04342C; }
  .board .ts { fill: #085041; }
  .cat .th { fill: #412402; }
  .cat .ts { fill: #633806; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>

<g><rect class="board" x="250" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Microscope Uno #4</text>
<text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">rover_microscope firmware</text></g>

<line x1="340" y1="86" x2="130" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="550" y2="160" class="arr" marker-end="url(#arrow)"/>

<g><rect class="cat" x="40" y="160" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="178" text-anchor="middle" dominant-baseline="central">Focus stepper</text>
<text class="ts" x="130" y="196" text-anchor="middle" dominant-baseline="central">Pins 8, 9, 10, 11</text></g>
<g><rect class="cat" x="250" y="160" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">LED brightness</text>
<text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">Pin 6, PWM</text></g>
<g><rect class="cat" x="460" y="160" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="178" text-anchor="middle" dominant-baseline="central">Lens cover servo</text>
<text class="ts" x="550" y="196" text-anchor="middle" dominant-baseline="central">Pin 5</text></g>
</svg>
