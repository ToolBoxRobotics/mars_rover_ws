# IK solver for the "arm" planning group. KDL (bundled with every
# MoveIt install) rather than TRAC-IK or bio_ik - those are often
# faster/more reliable for hard poses, but need an extra system
# package that isn't guaranteed installed. Switch if IK performance
# becomes a real bottleneck; not a concern for the slow, deliberate
# motions this sample-inspection arm actually needs.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.02
