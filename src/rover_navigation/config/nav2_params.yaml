# Nav2 parameters for the rover. Standard Nav2 structure and plugin
# choices (regulated_pure_pursuit_controller, NavFn, AMCL, the default
# behavior tree) - not reinvented here, only adapted with this robot's
# actual footprint and velocity limits (rover_base/config/
# base_topology.yaml: max_linear_mps 0.65, max_angular_radps 1.5) and
# frame names (matching rover_base's odometry_node and
# rover_description's URDF).
#
# For autonomous navigation against a saved map (see
# rover_navigation/launch/navigation.launch.py). For building that map
# in the first place, see slam_toolbox_params.yaml /
# launch/slam.launch.py instead - the two are not run at the same time.
#
# IMPORTANT: this ships with reasonable, standard starting values, not
# a tuned config for your actual environment. Expect to adjust costmap
# inflation, controller acceleration limits, and the recovery behaviors
# after watching the rover navigate a few times - that iteration is
# normal for any Nav2 deployment, not a sign something here is wrong.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    max_particles: 2000
    min_particles: 500
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    transform_tolerance: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Uses Nav2's own default navigate-to-pose / navigate-through-poses
    # behavior trees (installed with the nav2_bt_navigator package) -
    # not overridden here. Point default_nav_to_pose_bt_xml /
    # default_nav_through_poses_bt_xml at a custom tree file later if
    # you need different recovery logic than the stock one.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true

    # Regulated Pure Pursuit: a good default for a rover whose corner
    # steering behaves like a nonholonomic (car-like) base in ACKERMANN
    # mode - it slows down through curvature and near obstacles rather
    # than assuming the omnidirectional-ish behavior a pure DWB config
    # would. Nav2 only ever commands ACKERMANN-style (v, w) twists; it
    # has no notion of this rover's POINT_TURN mode.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4          # comfortably under max_linear_mps (0.65)
      max_linear_accel: 0.5
      max_linear_decel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 1.5
      min_turning_radius: 0.0           # POINT_TURN capability means 0 is fine, unlike a true car
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Rectangular footprint covering the actual wheel extents (track
      # is wider than the chassis body itself - see chassis.xacro),
      # with a small safety margin, rather than the chassis body alone.
      footprint: "[[0.40, 0.28], [0.40, -0.28], [-0.40, -0.28], [-0.40, 0.28]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 1.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          # See slam_toolbox_params.yaml's comment on the RPLIDAR C1's
          # reflectivity-dependent range (up to 12m white, ~6m black).
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          clearing: true
          marking: true
          data_type: "LaserScan"
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.40, 0.28], [0.40, -0.28], [-0.40, -0.28], [-0.40, 0.28]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename intentionally left unset here - passed as a launch
    # argument (see navigation.launch.py's `map` argument) so the same
    # params file works for whichever map you've saved.

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.65, 0.0, 1.5]     # matches rover_base's max_linear_mps / max_angular_radps
    min_velocity: [-0.65, 0.0, -1.5]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
